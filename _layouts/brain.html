---
layout: default
---

<section class="posts">
    <h1>{{ page.title }}</h1>
    {{content }}
    <ul>
        {% for brain in site.brain %}
        <li><a href="{{ site.baseurl }}{{ brain.url }}">{{ brain.name }}</a><div>{{brain.course}}, {{brain.source}}</div></li>
        {% endfor %}
    </ul>
</section>

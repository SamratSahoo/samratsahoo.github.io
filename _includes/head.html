<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == "/" or page.title == nil %}{{ site.title | escape }}{% else %}{% if page.tag %}{{ page.tag | escape }}{% else %}{{ page.title | strip_html | strip | escape }}{% endif %} · {{ site.title | escape }}{% endif %}</title>
  {% seo title=false %}
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="icon" type="image/webp" href="{{ '/favicon.webp' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/atom.xml' | relative_url }}">
  <link rel="alternate" type="application/json" title="{{ site.title }}" href="{{ '/feed.json' | absolute_url }}">
  <link rel="sitemap" type="application/xml" title="sitemap" href="{{ '/sitemap.xml' | relative_url }}">
  <style>
    {% include site.css %}
  </style>
</head>

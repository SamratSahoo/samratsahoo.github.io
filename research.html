---
layout: default
permalink: /research
title: research
---

<section class="posts">
    <h1>{{ page.title }}</h1>
    <ul>
        {% for post in site.research reversed %}
        <li><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a><time
                datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%m-%d-%Y" }}</time></li>
        {% endfor %}
    </ul>
</section>
